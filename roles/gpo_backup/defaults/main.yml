---
# DNS name of the domain to export (required).
gpo_backup_domain: ''

# DC to run against; empty = the domain's PDC emulator, which avoids
# AD-vs-SYSVOL replication races.
gpo_backup_server: ''

# Controller-side directory the export lands in — normally your repo working
# copy (required). Receives gpos/<Name>/... and gpo-manifest.json.
gpo_backup_repo_dir: ''

# Limit the export to these GPO display names (empty = every GPO).
# Deleted-GPO detection is skipped when filtering.
gpo_backup_gpos: []

# Re-ship every GPO even when its content hash is unchanged.
gpo_backup_full_export: false

# Remove repo folders of GPOs that no longer exist in the domain.
gpo_backup_prune_deleted: false

# Working directory on the management host (staging, per-domain state file
# with the content hashes, export zip).
gpo_backup_workdir: 'C:\ProgramData\gpo-iac\backup'
