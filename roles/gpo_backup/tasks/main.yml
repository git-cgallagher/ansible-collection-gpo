---
- name: Assert required variables
  ansible.builtin.assert:
    that:
      - gpo_backup_domain | length > 0
      - gpo_backup_repo_dir | length > 0
    fail_msg: gpo_backup_domain and gpo_backup_repo_dir are required
    quiet: true

# Read-only against AD; writes only its working directory on the management
# host. check_mode: false so a --check run still computes the would-ship
# report (the script skips its state-file write in check mode).
- name: Export GPOs and topology manifest
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', role_path ~ '/files/backup_gpos.ps1') }}"
    parameters:
      Domain: "{{ gpo_backup_domain }}"
      Server: "{{ gpo_backup_server }}"
      WorkDir: "{{ gpo_backup_workdir }}"
      GpoNames: "{{ gpo_backup_gpos }}"
      FullExport: "{{ gpo_backup_full_export | bool }}"
      CheckMode: "{{ ansible_check_mode }}"
  register: gpo_backup_export
  check_mode: false

- name: Report what changed
  ansible.builtin.debug:
    msg: >-
      {{ gpo_backup_export.result.gpo_count }} GPO(s) in {{ gpo_backup_domain }}:
      shipping {{ gpo_backup_export.result.shipped | length }},
      deleted {{ gpo_backup_export.result.deleted | length }},
      manifest changed: {{ gpo_backup_export.result.manifest_changed }}

- name: Fetch and unpack the export on the controller
  when:
    - gpo_backup_export.result.changed | bool or gpo_backup_full_export | bool
    - not ansible_check_mode
  block:
    - name: Create a controller-side staging directory
      ansible.builtin.tempfile:
        state: directory
        suffix: gpo-export
      register: gpo_backup_tmp
      delegate_to: localhost

    - name: Fetch the export zip
      ansible.builtin.fetch:
        src: "{{ gpo_backup_export.result.zip }}"
        dest: "{{ gpo_backup_tmp.path }}/gpo-export.zip"
        flat: true

    - name: Ensure the repo gpos directory exists
      ansible.builtin.file:
        path: "{{ gpo_backup_repo_dir }}/gpos"
        state: directory
        mode: '0755'
      delegate_to: localhost

    # A re-backup gets a fresh {backup-guid} subfolder; the previous one must
    # not linger next to it in the repo.
    - name: Remove re-exported GPO folders before unpacking
      ansible.builtin.file:
        path: "{{ gpo_backup_repo_dir }}/gpos/{{ item.backup_dir }}"
        state: absent
      loop: "{{ gpo_backup_export.result.shipped }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost

    - name: Unpack the export into the repo
      ansible.builtin.unarchive:
        src: "{{ gpo_backup_tmp.path }}/gpo-export.zip"
        dest: "{{ gpo_backup_repo_dir }}"
        remote_src: true
      delegate_to: localhost

    - name: Prune folders of deleted GPOs
      ansible.builtin.file:
        path: "{{ gpo_backup_repo_dir }}/gpos/{{ item.backup_dir }}"
        state: absent
      loop: "{{ gpo_backup_export.result.deleted if gpo_backup_prune_deleted else [] }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost

    - name: Remove the controller staging directory
      ansible.builtin.file:
        path: "{{ gpo_backup_tmp.path }}"
        state: absent
      delegate_to: localhost
