---
- name: Export the domain with gpo_backup
  hosts: all
  gather_facts: false
  tasks:
    - name: Run gpo_backup
      ansible.builtin.include_role:
        name: git_cgallagher.gpo.gpo_backup
      vars:
        gpo_backup_domain: "{{ lab_domain }}"
        gpo_backup_repo_dir: "{{ lab_dir }}/gpo-repo"
