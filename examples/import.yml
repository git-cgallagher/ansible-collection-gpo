---
# Converge the target domain on the repo. Run with -e gpo_import_report_only=true
# (or --check) first and read the action list before applying.
- name: Import GPOs from the repo
  hosts: gpo_mgmt_prod
  gather_facts: false
  roles:
    - role: git_cgallagher.windows.gpo_import
      vars:
        gpo_import_domain: prod.example.com
        gpo_import_source_dir: "{{ playbook_dir }}/../gpo-repo"
        gpo_import_migration_table: migtables/prod.migtable
        gpo_import_report_only: true
