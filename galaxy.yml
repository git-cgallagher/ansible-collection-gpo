namespace: git_cgallagher
name: windows
version: 0.2.0
readme: README.md
authors:
  - Chris Gallagher (@git-cgallagher)
description: >-
  Windows Server automation, starting with Group Policy as code: export
  domain GPOs with their links, precedence, filtering and WMI filters to
  Git, and import them into a target domain via Backup-GPO/Import-GPO plus
  a declarative manifest.
license:
  - MIT
tags:
  - windows
  - gpo
  - grouppolicy
  - activedirectory
  - iac
dependencies:
  ansible.windows: '>=2.0.0'
repository: https://github.com/git-cgallagher/ansible-collection-windows
documentation: https://github.com/git-cgallagher/ansible-collection-windows#readme
issues: https://github.com/git-cgallagher/ansible-collection-windows/issues
build_ignore:
  - .github
  - .ansible
  - collections
  - .config
  - roles/*/molecule
  - .molecule-collections
  - tests
  - '*.tar.gz'
  - .ansible-lint
  - .ansible-lint-ignore
  - .yamllint
  - .gitignore
  - AGENTS.md
